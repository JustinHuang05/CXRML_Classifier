name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Parse GCP Config
      - name: Parse GCP Config
        id: parse-config
        run: |
          CONFIG=$(cat ML-WS/gcp_config.json)
          echo "PROJECT_ID=$(echo $CONFIG | jq -r .project_id)" >> $GITHUB_ENV
          echo "REGION=$(echo $CONFIG | jq -r .region)" >> $GITHUB_ENV
          echo "SERVICE_NAME=$(echo $CONFIG | jq -r .service_name)" >> $GITHUB_ENV
          echo "MEMORY=$(echo $CONFIG | jq -r .memory)" >> $GITHUB_ENV
          echo "CPU=$(echo $CONFIG | jq -r .cpu)" >> $GITHUB_ENV
          echo "MIN_INSTANCES=$(echo $CONFIG | jq -r .min_instances)" >> $GITHUB_ENV
          echo "MAX_INSTANCES=$(echo $CONFIG | jq -r .max_instances)" >> $GITHUB_ENV
          echo "SERVICE_ACCOUNT_EMAIL=$(echo $CONFIG | jq -r .service_account_email)" >> $GITHUB_ENV

      # Step 3: Setup GCloud CLI (service_account_key errors, but it still seems to work)
      - name: Setup GCloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      # Step 4: Authenticate GCloud
      - name: Google Cloud Auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"
          project_id: ${{ env.PROJECT_ID }}

      # Step 5: Authenticate Docker with Google Container Registry
      - name: "Login to GCR"
        uses: "docker/login-action@v3"
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      # Step 6: Build Docker Image
      - name: Build Docker Image
        run: |
          echo "Building Docker image..."
          docker buildx build --platform linux/amd64 -t gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest ML-WS/

      # Step 7: Push Docker Image
      - name: Push Docker Image
        run: |
          echo "Pushing Docker image to Google Container Registry..."
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest

      # Step 8: Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          echo "Deploying service to Cloud Run..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory ${{ env.MEMORY }} \
            --cpu ${{ env.CPU }} \
            --min-instances ${{ env.MIN_INSTANCES }} \
            --max-instances ${{ env.MAX_INSTANCES }}

      # Step 9: Output Cloud Run Service URL
      - name: Output Cloud Run URL
        id: cloud-run-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --platform managed --region ${{ env.REGION }} --format "value(status.url)")
          echo "CLOUD_RUN_URL=$URL" >> $GITHUB_ENV
          echo "::set-output name=CLOUD_RUN_URL::$URL"
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}

      # Step 10: Print the Cloud Run URL to the console
      - name: Display Cloud Run URL
        run: |
          echo "Your service is live at: ${{ env.CLOUD_RUN_URL }}"
